databases:
  - name: daily-logger-db
    databaseName: daily_logger
    user: daily_logger
    plan: free          # upgrade to starter/standard for production
    region: singapore

services:
  - type: web
    name: daily-logger-api
    runtime: python
    plan: free          # upgrade for always-on (free tier spins down after inactivity)
    region: singapore

    # Build step: install deps from the backend sub-directory
    rootDir: backend
    buildCommand: pip install -r requirements.txt

    # Start the ASGI server. Render sets $PORT automatically.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --app-dir .

    envVars:
      # Render injects postgresql:// — config.py's validator rewrites it to postgresql+asyncpg://
      - key: DATABASE_URL
        fromDatabase:
          name: daily-logger-db
          property: connectionString

      # Frontend URL used for CORS
      - key: FRONTEND_URL
        value: https://frontend-alpha-ashen-54.vercel.app

      # Clerk – JWT verification for /api/* routes
      - key: CLERK_JWKS_URL
        value: https://frontend-alpha-ashen-54.vercel.app/__clerk/.well-known/jwks.json

    healthCheckPath: /health
