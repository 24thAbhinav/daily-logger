services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_logger
      POSTGRES_USER: daily_logger
      POSTGRES_PASSWORD: daily_logger
    ports:
      - "5432:5432"
    volumes:
      - daily_logger_data:/var/lib/postgresql/data

volumes:
  daily_logger_data:
