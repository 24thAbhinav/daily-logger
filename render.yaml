databases:
  - name: daily-logger-db
    databaseName: daily_logger
    user: daily_logger
    plan: free          # upgrade to starter/standard for production

services:
  - type: web
    name: daily-logger-api
    runtime: python
    plan: free          # upgrade for always-on (free tier spins down after inactivity)
    region: oregon      # change to match your Vercel region if latency matters

    # Build step: install deps from the backend sub-directory
    rootDir: backend
    buildCommand: pip install -r requirements.txt

    # Start the ASGI server. Render sets $PORT automatically.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir .

    envVars:
      # Render injects postgresql:// — config.py's validator rewrites it to postgresql+asyncpg://
      - key: DATABASE_URL
        fromDatabase:
          name: daily-logger-db
          property: connectionString

      # Frontend URL used for CORS and Better Auth session verification
      - key: FRONTEND_URL
        value: https://frontend-alpha-ashen-54.vercel.app
      - key: BETTER_AUTH_URL
        value: https://frontend-alpha-ashen-54.vercel.app
      # Set this to the exact same value as the Vercel BETTER_AUTH_SECRET.
      - key: BETTER_AUTH_SECRET
        sync: false

    healthCheckPath: /health
